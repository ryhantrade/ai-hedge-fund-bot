# Render Blueprint — AI Hedge Fund Board (paper trading only).
# Always-on WEB service on a paid Starter instance (0.5 CPU / 512 MB,
# $7/mo, never sleeps) + 1 GB persistent disk ($0.25/mo) for the paper
# ledger. A background thread runs the scan cycle every 4h.
# NOTE: Render Cron Jobs CANNOT use persistent disks (Render docs), so
# the board is a web service with an internal loop, not a cron job.
# Deploy: push this repo to GitHub, then "New +" > "Blueprint" in
# Render and point it at the repo (or create the web service manually
# with the same settings). Set GITHUB_PAT only if you want the
# git-push-back fallback (not needed while the disk is attached).
services:
  - type: web
    name: ai-hedge-fund-board
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 && pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LEDGER_PATH
        value: /data/paper_trades.jsonl
      - key: SCAN_LOG_PATH
        value: /data/scan_log.jsonl
      - key: SCAN_INTERVAL_SECONDS
        value: "14400"
      - key: FUND_SIGNAL_MODE
        value: deposit
      - key: KRONOS_MODEL
        value: mini
    disk:
      name: hedgefund-data
      mountPath: /data
      sizeGB: 1
